name: Build & Release (Personal — SEED BRIDGE)

# Johannes' personal build only. Separate tag pattern (personal-v*, never v*.*.*)
# so this can NEVER collide with or be mistaken for a team release, and the
# release step below always sets prerelease: true so GitHub's own
# /releases/latest endpoint (what updater.py's auto-update check calls) never
# returns it — the team's app never sees or prompts for this build.
#
# To ship a new personal build:
#   git tag personal-v14.1.0 && git push origin personal-v14.1.0

on:
  push:
    tags:
      - "personal-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Personal version tag (e.g. personal-v14.0.0)"
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (Bridge)
    runs-on: windows-latest
    steps:
      - name: Checkout seed-viewer
        uses: actions/checkout@v4

      - name: Checkout seed-film (source)
        uses: actions/checkout@v4
        with:
          repository: seed-atara/seed-film
          token: ${{ secrets.SEED_FILM_TOKEN }}
          path: _seed_film

      - name: Write internal ARK key (Seedance/Seedream)
        shell: bash
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: python -c "import os;open('_seed_film/seed_ark_key.py','w').write('ARK_API_KEY = %r\n' % (os.environ.get('ARK_API_KEY') or ''))"

      - name: Write internal Anthropic key (PIP)
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -c "import os;open('_seed_film/seed_anthropic_key.py','w').write('ANTHROPIC_API_KEY = %r\n' % (os.environ.get('ANTHROPIC_API_KEY') or ''))"

      - name: Write internal Beeble key (SwitchX)
        shell: bash
        env:
          BEEBLE_API_KEY: ${{ secrets.BEEBLE_API_KEY }}
        run: python -c "import os;open('_seed_film/seed_beeble_key.py','w').write('BEEBLE_API_KEY = %r\n' % (os.environ.get('BEEBLE_API_KEY') or ''))"

      - name: Download figure-seg model (u2netp, 4.7MB)
        shell: bash
        run: curl -L -o _seed_film/u2netp.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-build.txt

      - name: Prepare source files from seed-film
        run: python build/prepare_sources.py --source _seed_film

      - name: Stamp build version
        env:
          SV_TAG: ${{ github.ref_name }}
        run: python -c "import os;open('seed_viewer/_buildinfo.py','w').write('VERSION = %r\n' % os.environ['SV_TAG'])"

      - name: Download FFmpeg (Windows)
        run: python build/download_ffmpeg.py

      - name: Build with PyInstaller
        run: |
          pyinstaller build\seed_viewer_win_v14.spec `
            --distpath build\dist --workpath build\work --clean

      - name: Zip Windows build
        run: |
          Compress-Archive -Path build\dist\SeedBridge `
            -DestinationPath build\dist\SeedBridge-win.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeedBridge-win
          path: build/dist/SeedBridge-win.zip

  release:
    name: Create Release (prerelease)
    runs-on: ubuntu-latest
    needs: [build-windows]
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SEED BRIDGE ${{ github.ref_name }} (personal)"
          body: |
            Personal build. Not for the team — install alongside SeedViewer,
            it never touches or replaces it (separate SeedBridge.exe, separate
            folder). Marked as a GitHub prerelease on purpose so it never shows
            up as an update for the team's SeedViewer.

            | Platform | File |
            |----------|------|
            | Windows 11 | `SeedBridge-win.zip` |
          files: |
            artifacts/SeedBridge-win/SeedBridge-win.zip
          draft: false
          prerelease: true
